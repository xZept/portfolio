name: Weekly Portfolio Watchdog

on:
  schedule:
    # Runs every Monday at 09:00 PHT (01:00 UTC)
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  trigger-watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Wake n8n and trigger watchdog workflow
        run: |
          curl -f -s -S -X POST "${{ secrets.N8N_WATCHDOG_WEBHOOK_URL }}" \
            --max-time 90 \
            -H "Content-Type: application/json" \
            -w "\nHTTP Status: %{http_code}\n"
